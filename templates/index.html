<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Alex Machado Ribeiro">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COBRA FLEX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static',filename='css/fontes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/estilo.css') }}">
  </head>
  <body>
    <main class="container vh-100 d-flex align-items-center justify-content-center">
       <div class="row">
        <figure class="d-flex justify-content-center mb-3">
          <img src="{{ url_for('static',filename='img/icons8-combustivel-94.png') }}" alt="Logo">
        </figure>
        <div class="d-flex justify-content-center mb-5">
          <h1>COBRA FLEX</h1>
        </div>
        <form action="/melhorCombustivel" method="POST">
          <div class="col-12">
            <label for="gasolina" class="form-label">
              Gasolina:
            </label>
            <input type="number" placeholder="R$ 0,00" class="form-control" name="gasolina" step="0.01" required>
          </div>
          <div class="col-12">
            <label for="etanol" class="form-label">
              Etanol:
            </label>
            <input type="number" placeholder="R$ 0,00" class="form-control" name="etanol" step="0.01" required>
          </div>
          <div class="d-flex justify-content-center mt-5">
            <button type="submit" class="btn btn-success col-4">
              Calcular
            </button>
          </div>
        </form>
        <h2>
          {{ msg if msg else '' }}
        </h2>
       </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
