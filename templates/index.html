<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Alex Machado Ribeiro">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COBRA FLEX</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static',filename='css/fontes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/estilo.css') }}">
  </head>
  <body class="bg-dark text-body d-flex align-items-center min-vh-100">

    <main class="container d-flex justify-content-center py-4">
      <!-- Card nativo do Bootstrap -->
      <div class="card shadow-lg border-0 rounded-4 p-4 card-custom">
        <div class="card-body">
          
          <!-- Logo e Título -->
          <div class="text-center mb-4">
            <img src="{{ url_for('static',filename='img/icons8-combustivel-94.png') }}" alt="Logo" class="img-fluid mb-2" style="max-height: 70px;">
            <h1 class="h3 fw-bold text-dark m-0">COBRA FLEX</h1>
          </div>

          <!-- Formulário -->
          <form action="/melhorCombustivel" method="POST">
            <div class="mb-3">
              <label for="gasolina" class="form-label fw-semibold text-secondary">Gasolina</label>
              <input type="number" id="gasolina" name="gasolina" step="0.01" class="form-control form-control-lg" placeholder="R$ 0,00" required>
            </div>

            <div class="mb-4">
              <label for="etanol" class="form-label fw-semibold text-secondary">Etanol</label>
              <input type="number" id="etanol" name="etanol" step="0.01" class="form-control form-control-lg" placeholder="R$ 0,00" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-3">
              Calcular
            </button>
          </form>

          <!-- Resultado usando Alert nativo do Bootstrap -->
          {% if msg %}
            <div class="alert alert-success mt-4 text-center mb-0 fw-semibold" role="alert">
              {{ msg }}
            </div>
          {% endif %}

        </div>
      </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
